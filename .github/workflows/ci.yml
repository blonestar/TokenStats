name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.7.0
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build application
        run: pnpm build
      - name: Package Linux AppImage
        run: pnpm package:linux

  windows:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pnpm
        shell: pwsh
        run: npm install --global pnpm@11.7.0
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Package Windows x64 NSIS installer
        run: pnpm package:win
      - name: Install and smoke-test Windows package
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter 'TokenStats-*-win-x64.exe' -File | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'Windows x64 NSIS installer was not produced.'
          }
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/validate-windows-package.ps1') -InstallerPath $installer.FullName
