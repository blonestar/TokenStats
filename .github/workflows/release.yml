name: Stable release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.7.0
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Validate tag version
        run: pnpm release:check-version --stable-only -- "$GITHUB_REF_NAME"
      - name: Run tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck

  draft-release:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.7.0
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Validate tag version
        run: pnpm release:check-version --stable-only -- "$GITHUB_REF_NAME"
      - name: Package and publish Linux AppImage update metadata
        run: pnpm package:linux:release
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify Linux updater manifest
        run: |
          test -s dist/latest-linux.yml
          grep -Fq "TokenStats-${GITHUB_REF_NAME#v}-linux-x86_64.AppImage" dist/latest-linux.yml
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          import { join } from 'node:path'

          const manifest = readFileSync('dist/latest-linux.yml', 'utf8')
          const match = manifest.match(/files:\n\s+- url: (\S+)\n\s+sha512: (\S+)/)
          if (!match) throw new Error('latest-linux.yml has no file SHA-512 entry')
          const actual = createHash('sha512').update(readFileSync(join('dist', match[1]))).digest('base64')
          if (actual !== match[2]) throw new Error('latest-linux.yml SHA-512 does not match the AppImage')
          NODE
      - name: Create and verify checksum manifest
        run: |
          cd dist
          sha256sum TokenStats-*.AppImage > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Add checksum manifest to draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS.txt --clobber
