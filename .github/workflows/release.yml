name: Stable release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@11.7.0
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Validate tag version
        run: pnpm release:check-version --stable-only -- "$GITHUB_REF_NAME"
      - name: Run tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck

  draft-release:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@11.7.0
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Validate tag version
        run: pnpm release:check-version --stable-only -- "$GITHUB_REF_NAME"
      - name: Package Linux AppImage
        run: pnpm package:linux
      - name: Create and verify checksum manifest
        run: |
          cd dist
          sha256sum TokenStats-*.AppImage > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/TokenStats-*.AppImage
          dist/SHA256SUMS.txt
          --draft
          --verify-tag
          --title "TokenStats $GITHUB_REF_NAME"
          --generate-notes
