name: Stable release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.7.0
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Validate tag version
        run: pnpm release:check-version --stable-only -- "$GITHUB_REF_NAME"
      - name: Run tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck

  draft-release:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.7.0
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Validate tag version
        run: pnpm release:check-version --stable-only -- "$GITHUB_REF_NAME"
      - name: Package and publish Linux AppImage update metadata
        run: pnpm package:linux:release
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify Linux updater manifest
        run: |
          test -s dist/latest-linux.yml
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          import { join } from 'node:path'

          const manifest = readFileSync('dist/latest-linux.yml', 'utf8')
          const match = manifest.match(/files:\n\s+- url: (\S+)\n\s+sha512: (\S+)/)
          if (!match) throw new Error('latest-linux.yml has no file SHA-512 entry')
          if (match[1] !== 'TokenStats-linux-x86_64.AppImage') throw new Error(`latest-linux.yml points to unexpected artifact: ${match[1]}`)
          const actual = createHash('sha512').update(readFileSync(join('dist', match[1]))).digest('base64')
          if (actual !== match[2]) throw new Error('latest-linux.yml SHA-512 does not match the AppImage')
          NODE
      - name: Create and verify checksum manifest
        run: |
          cd dist
          sha256sum TokenStats-*.AppImage > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Add checksum manifest to draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS.txt --clobber

  windows-release:
    needs: draft-release
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pnpm
        shell: pwsh
        run: npm install --global pnpm@11.7.0
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Validate tag version
        shell: pwsh
        run: pnpm release:check-version --stable-only -- "$env:GITHUB_REF_NAME"
      - name: Package and publish Windows x64 NSIS installer
        run: pnpm package:win:release
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify Windows updater manifest
        shell: pwsh
        run: |
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'dist/latest.yml'
          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw 'latest.yml was not produced for the Windows release.'
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw
          $match = [regex]::Match($manifest, 'files:\s*-\s*url:\s*(\S+)\s+sha512:\s*(\S+)', [Text.RegularExpressions.RegexOptions]::Singleline)
          if (-not $match.Success) {
            throw 'latest.yml has no Windows file SHA-512 entry.'
          }
          $artifactPath = Join-Path (Split-Path -Parent $manifestPath) $match.Groups[1].Value
          if (-not (Test-Path -LiteralPath $artifactPath)) {
            throw "latest.yml points to a missing artifact: $artifactPath"
          }
          $sha512 = [Security.Cryptography.SHA512]::Create()
          try {
            $actual = [Convert]::ToBase64String($sha512.ComputeHash([IO.File]::ReadAllBytes($artifactPath)))
          }
          finally {
            $sha512.Dispose()
          }
          if ($actual -ne $match.Groups[2].Value) {
            throw 'latest.yml SHA-512 does not match the Windows installer.'
          }
      - name: Install and smoke-test Windows package
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter 'TokenStats-*-win-x64.exe' -File | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'Windows x64 NSIS installer was not produced.'
          }
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/validate-windows-package.ps1') -InstallerPath $installer.FullName
      - name: Create and verify Windows checksum manifest
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter 'TokenStats-*-win-x64.exe' -File | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'Windows installer is missing for checksum generation.'
          }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'dist/SHA256SUMS-windows.txt'
          "$hash  $($installer.Name)" | Set-Content -LiteralPath $manifestPath -Encoding ascii
          $check = Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256
          if ($check.Hash.ToLowerInvariant() -ne $hash) {
            throw 'Windows checksum verification failed.'
          }
      - name: Add Windows checksum manifest to draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" dist/SHA256SUMS-windows.txt --clobber

  macos-release:
    needs: draft-release
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.7.0
      - name: Assert native Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Validate tag version
        run: pnpm release:check-version --stable-only -- "$GITHUB_REF_NAME"
      - name: Package macOS arm64 ZIP
        run: pnpm package:mac:arm64
      - name: Validate packaged macOS arm64 app
        run: bash scripts/validate-macos-arm64.sh
      - name: Create and verify macOS checksum manifest
        run: |
          cd dist
          shasum -a 256 TokenStats-*-mac-arm64.zip > SHA256SUMS-mac-arm64.txt
          shasum -a 256 --check SHA256SUMS-mac-arm64.txt
      - name: Add macOS arm64 artifact to draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/TokenStats-*-mac-arm64.zip dist/SHA256SUMS-mac-arm64.txt --clobber

  release-ready:
    needs: [draft-release, windows-release, macos-release]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify all three platform release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          required_assets=(
            "TokenStats-linux-x86_64.AppImage"
            "latest-linux.yml"
            "SHA256SUMS.txt"
            "TokenStats-${version}-win-x64.exe"
            "latest.yml"
            "SHA256SUMS-windows.txt"
            "TokenStats-${version}-mac-arm64.zip"
            "SHA256SUMS-mac-arm64.txt"
          )
          for asset in "${required_assets[@]}"; do
            if ! grep -Fxq "$asset" <<<"$assets"; then
              echo "Missing required release asset: $asset" >&2
              exit 1
            fi
          done
          echo "All Linux, Windows, and macOS arm64 release assets are present."
